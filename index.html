<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Футер</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .footer {
            margin-top: auto;
            padding: 40px 50px;
            background: #1b2430;
        }

        .footer-wrap {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
        }

        .logo {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: #4da3ff;
        }

        .links h3 {
            margin: 0 0 12px;
            color: #ffffff;
            font-size: 15px;
        }

        .links ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .links li {
            margin-bottom: 8px;
        }

        .links a {
            color: #b9c4d0;
            font-size: 15px;
            text-decoration: none;
        }

        .copy {
            margin: 0;
            color: #b9c4d0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <footer class="footer">
        <div class="footer-wrap">
            <a class="logo" href="#">Web<span>Tech</span></a>

            <nav class="links">
                <h3>Компанія</h3>
                <ul>
                    <li><a href="#">Про нас</a></li>
                    <li><a href="#">Наша команда</a></li>
                    <li><a href="#">Контакти</a></li>
                </ul>
            </nav>

            <nav class="links">
                <h3>Послуги</h3>
                <ul>
                    <li><a href="#">Розробка сайтів</a></li>
                    <li><a href="#">Веб-дизайн</a></li>
                    <li><a href="#">Підтримка</a></li>
                </ul>
            </nav>

            <nav class="links">
                <h3>Ресурси</h3>
                <ul>
                    <li><a href="#">Блог</a></li>
                    <li><a href="#">Документація</a></li>
                    <li><a href="#">Питання та відповіді</a></li>
                </ul>
            </nav>

            <p class="copy">© 2026 WebTech. Усі права захищені.</p>
        </div>
    </footer>
</body>
</html>
